name: Build and Deploy Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Get build info
      id: build-info
      run: |
        echo "BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
        echo "GIT_COMMIT=${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "APP_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/deseandola:latest
          ${{ secrets.DOCKER_USERNAME }}/deseandola:${{ steps.build-info.outputs.APP_VERSION }}
        build-args: |
          VITE_DIRECTUS_URL=${{ secrets.VITE_DIRECTUS_URL }}
          VITE_DIRECTUS_TOKEN=${{ secrets.VITE_DIRECTUS_TOKEN }}
          VITE_APP_VERSION=${{ steps.build-info.outputs.APP_VERSION }}
          VITE_BUILD_TIME=${{ steps.build-info.outputs.BUILD_TIME }}
          VITE_GIT_COMMIT=${{ steps.build-info.outputs.GIT_COMMIT }}
        cache-from: type=gha
        cache-to: type=gha,mode=max