version: '3.8'

services:
  deseandola-frontend:
    build:
      context: .
      args:
        VITE_DIRECTUS_URL: ${VITE_DIRECTUS_URL:-https://hoztlat-regalos.6vlrrp.easypanel.host}
        VITE_DIRECTUS_TOKEN: ${VITE_DIRECTUS_TOKEN:-8CzN175Z3ibcoDZQRnD3v86AkZAcoaeh}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
        VITE_BUILD_TIME: ${VITE_BUILD_TIME:-$(date '+%Y-%m-%d %H:%M:%S')}
        VITE_GIT_COMMIT: ${VITE_GIT_COMMIT:-local}
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped