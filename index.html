<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deseándola — En construcción</title>
  <style>
    :root{
      --lila: #cdb4db;         /* lila pastel principal */
      --lila-2:#e2c9f2;        /* lila claro */
      --lila-3:#f3e9ff;        /* fondo muy claro */
      --malva:#b49acb;         /* acento */
      --gris:#5e5a64;          /* texto */
      --blanco:#ffffff;
      --shadow: 0 10px 30px rgba(173, 131, 230, .15);
    }

    /* Reset mínimo y tipografía */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--gris);
      background: radial-gradient(1200px 800px at 20% 10%, var(--lila-3), var(--blanco)) fixed;
      overflow-x:hidden;
    }

    /* Fondo sutil animado */
    .bg{
      position:fixed; inset:0; pointer-events:none; z-index:-1;
      background:
        radial-gradient(600px 400px at 80% 20%, rgba(205,180,219,.35), transparent 60%),
        radial-gradient(700px 500px at 15% 80%, rgba(226,201,242,.35), transparent 60%);
      animation:bgShift 18s ease-in-out infinite alternate;
      filter:saturate(105%);
    }
    @keyframes bgShift{
      0%{transform:translate3d(0,0,0)}
      100%{transform:translate3d(0,-20px,0)}
    }

    /* Contenedor principal */
    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:48px 20px;
    }

    /* Tarjeta */
    .card{
      position:relative;
      width:min(680px, 92vw);
      padding:40px 28px 28px;
      border-radius:24px;
      background:linear-gradient(180deg, var(--blanco), var(--lila-3));
      box-shadow:var(--shadow);
      border:1px solid rgba(205,180,219,.35);
      transition:transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
      will-change: transform;
    }
    .card:hover{
      transform:translateY(-2px) rotateX(0.5deg);
      box-shadow:0 16px 40px rgba(173,131,230,.22);
    }

    /* Cinta “en construcción” */
    .ribbon{
      position:absolute; inset-block-start:12px; inset-inline-end:-14px;
      background: linear-gradient(90deg, var(--lila), var(--lila-2));
      color:#4a4060; font-weight:600; letter-spacing:.3px;
      padding:8px 16px;
      transform:rotate(6deg);
      border-radius:12px;
      box-shadow:0 8px 18px rgba(173,131,230,.25);
      border:1px solid rgba(255,255,255,.7);
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(28px, 6vw, 44px);
      line-height:1.05;
      color:#473a5e;
      text-wrap:balance;
    }

    .brand{
      display:inline-grid; grid-auto-flow:column; align-items:center; gap:.5ch;
      padding:.25rem .6rem; border-radius:12px;
      background: rgba(205,180,219,.18);
      border:1px solid rgba(205,180,219,.45);
    }
    .dot{
      inline-size:.6em; block-size:.6em; border-radius:50%;
      background: var(--malva);
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 0 0 rgba(180,154,203,.4);
    }
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(180,154,203,.45)}
      70%{box-shadow:0 0 0 12px rgba(180,154,203,0)}
      100%{box-shadow:0 0 0 0 rgba(180,154,203,0)}
    }

    p.lead{
      margin:10px 0 16px;
      font-size:clamp(16px, 3.2vw, 18px);
      opacity:.9;
    }

    /* Microid: subrayado animado */
    .underline{
      position:relative; display:inline-block;
    }
    .underline::after{
      content:"";
      position:absolute; left:0; right:100%; bottom:-2px; height:3px;
      background: linear-gradient(90deg, var(--lila), var(--malva));
      border-radius:2px;
      transition:right .9s cubic-bezier(.2,.8,.2,1);
    }
    .card:hover .underline::after{ right:0%; }

    /* Botón */
    .btn{
      display:inline-flex; align-items:center; gap:.6ch;
      padding:12px 18px;
      background: linear-gradient(180deg, var(--lila), var(--malva));
      color:var(--blanco); font-weight:600; text-decoration:none;
      border-radius:14px; border:0;
      box-shadow:0 8px 18px rgba(173,131,230,.25);
      transition: transform .15s ease, box-shadow .15s ease, letter-spacing .15s ease;
      will-change: transform;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow:0 12px 26px rgba(173,131,230,.32); letter-spacing:.2px; }
    .btn:active{ transform: translateY(0); box-shadow:0 8px 18px rgba(173,131,230,.25); }

    /* Línea de progreso con puntitos */
    .loader{
      display:inline-grid; grid-auto-flow:column; gap:8px; margin-top:12px;
    }
    .loader span{
      width:8px; height:8px; border-radius:50%;
      background:var(--malva); opacity:.55;
      animation: blink 1.6s ease-in-out infinite;
    }
    .loader span:nth-child(2){animation-delay:.2s}
    .loader span:nth-child(3){animation-delay:.4s}
    @keyframes blink{ 50%{ opacity:1; transform:translateY(-2px)} }

    /* Burbujas flotantes decorativas */
    .float{
      position:fixed; border-radius:50%; filter:blur(0.2px);
      background: radial-gradient(circle at 30% 30%, var(--lila-2), var(--lila));
      opacity:.18; pointer-events:none; z-index:-1;
      animation: float 14s ease-in-out infinite alternate;
    }
    .float.f1{ width:180px; height:180px; left:-60px; top:20%; animation-duration:17s}
    .float.f2{ width:120px; height:120px; right:10%; top:12%}
    .float.f3{ width:220px; height:220px; right:-70px; bottom:10%; animation-duration:19s}
    @keyframes float{
      to{ transform: translate3d(0,-18px,0) rotate(6deg) scale(1.03); }
    }

    /* Accesibilidad: respeta usuarios con “reduced motion” */
    @media (prefers-reduced-motion: reduce){
      .bg, .dot, .loader span, .float, .card, .underline::after{ animation:none; transition:none }
    }

    footer{
      margin-top:18px; font-size:13px; opacity:.75;
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="float f1" aria-hidden="true"></div>
  <div class="float f2" aria-hidden="true"></div>
  <div class="float f3" aria-hidden="true"></div>

  <main class="wrap">
    <section class="card" role="alert" aria-live="polite">
      <div class="ribbon">En construcción</div>

      <h1>
        Bienvenidos a <span class="underline">Deseándola</span>
      </h1>

      <p class="lead">
        Estamos preparando una experiencia linda y simple, en tonos <b>lila pastel</b>, con una navegación suave y detalles cuidados.
        <span class="brand"><span class="dot" aria-hidden="true"></span> Pronto disponible</span>
      </p>

      <a class="btn" href="#" onclick="event.preventDefault();">
        Avisarme cuando esté listo
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M13.172 12 8.222 7.05l1.414-1.414L16 12l-6.364 6.364-1.414-1.414z"/>
        </svg>
      </a>

      <div class="loader" aria-label="Cargando…">
        <span></span><span></span><span></span>
      </div>

      <footer>
        © <span id="y"></span> Deseándola · Todos los derechos reservados
      </footer>
    </section>
  </main>

  <script>
    // Año automático y micro-interacción de foco en teclado
    document.getElementById('y').textContent = new Date().getFullYear();
    document.addEventListener('keyup', e=>{
      if(e.key === 'Enter' || e.key === ' '){
        const b = document.querySelector('.btn');
        if(document.activeElement === b){ b.click(); }
      }
    });
  </script>
</body>
</html>
