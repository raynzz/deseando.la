<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deseando • Demo</title>
  <style>
    :root{
      --bg:#ffffff; --txt:#1f2937; --muted:#6b7280; --line:#e5e7eb;
      --brand:#111827; --pill:#f3f4f6; --pill-txt:#374151; --hover:#f9fafb;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--txt); font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial;
    }
    .wrap{max-width:1100px; margin:0 auto; padding:28px 20px 64px}
    header{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px}
    .logo{font-weight:800; font-size:28px; letter-spacing:.2px}
    .dot{color:#9ca3af}
    .sub{color:var(--muted); font-weight:500}
    .toolbar{
      display:grid; grid-template-columns:1fr 220px 120px; gap:10px; margin:16px 0 8px;
    }
    input[type="search"], select{
      padding:12px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--txt);
      outline:0; transition:border-color .15s ease, box-shadow .15s ease;
    }
    input[type="search"]:focus, select:focus{border-color:#cbd5e1; box-shadow:0 0 0 3px #e5e7eb}
    button{
      border:1px solid var(--line); background:#fff; padding:10px 12px; border-radius:10px; color:var(--txt); cursor:pointer;
    }
    button:hover{background:var(--hover)}
    .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:14px; margin-top:10px}
    .card{
      grid-column:span 12; border:1px solid var(--line); border-radius:16px; padding:16px; background:#fff;
      transition:box-shadow .15s ease, transform .05s ease;
    }
    .card:hover{box-shadow:0 3px 14px rgba(0,0,0,.05)}
    .row{display:flex; gap:14px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
    .title{font-weight:700; font-size:18px}
    .meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:14px}
    .pill{background:var(--pill); color:var(--pill-txt); padding:4px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line)}
    .desc{color:var(--muted); margin-top:6px}
    .actions{display:flex; gap:8px; align-items:center}
    .Link{color:#111827; text-decoration:none; border:1px solid var(--line); padding:8px 10px; border-radius:10px}
    .Link:hover{background:var(--hover)}
    .empty{color:var(--muted); text-align:center; padding:40px 10px; border:1px dashed var(--line); border-radius:12px}
    details{margin-top:12px; background:#fafafa; border:1px solid var(--line); border-radius:12px; overflow:hidden}
    summary{cursor:pointer; padding:12px 14px; font-weight:600; list-style:none}
    summary::-webkit-details-marker{display:none}
    .panel{padding:14px; border-top:1px solid var(--line); background:#fff}
    .list{display:flex; flex-direction:column; gap:8px}
    .item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff}
    .muted{color:var(--muted)}
    footer{margin-top:26px; color:var(--muted); font-size:14px}
    @media(min-width:700px){
      .card{grid-column:span 6}
    }
    @media(min-width:980px){
      .card{grid-column:span 4}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">Deseando <span class="dot">•</span></div>
      <div class="sub">Wishes públicos (demo Directus)</div>
    </header>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Buscar por título o descripción…" autocomplete="off" />
      <select id="status">
        <option value="">Todos los estados</option>
        <option value="active">Activos</option>
        <option value="completed">Completados</option>
        <option value="archived">Archivados</option>
      </select>
      <button id="refresh">Actualizar</button>
    </div>

    <div id="grid" class="grid"></div>

    <footer>
      Directus → Front demo • Edita <code>DIREC</code>/<code>TOKEN</code> en la cabecera del archivo. V1.1.5
    </footer>
  </div>

  <script>
    /***********************
     * CONFIGURACIÓN
     ***********************/
    const DIRECTUS_URL = "https://hoztlat-regalos.6vlrrp.easypanel.host";
    // Deja vacío "" para usar rol Public, o usa tu token (admin/frontend)
    const TOKEN = "8CzN175Z3ibcoDZQRnD3v86AkZAcoaeh";

    /***********************
     * HELPERS FETCH
     ***********************/
    function authHeaders() {
      const h = { "Accept": "application/json" };
      if (TOKEN && TOKEN.trim()) h["Authorization"] = "Bearer " + TOKEN.trim();
      return h;
    }

    async function api(path, params = {}) {
      const url = new URL(DIRECTUS_URL.replace(/\/$/, "") + path);
      Object.entries(params).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
      });
      const r = await fetch(url.toString(), { headers: authHeaders() });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }

    const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
    const fmt = new Intl.NumberFormat("es-AR",{style:"currency", currency:"ARS"});

    /***********************
     * UI RENDER
     ***********************/
    const grid = document.querySelector("#grid");
    const $q = document.querySelector("#q");
    const $status = document.querySelector("#status");
    const $refresh = document.querySelector("#refresh");

    let lastQuery = "";

    function cardSkeleton() {
      return `<div class="card">
        <div class="row"><div class="title" style="opacity:.5">Cargando…</div></div>
        <div class="desc muted">…</div>
      </div>`;
    }

    function renderEmpty(msg="No se encontraron resultados.") {
      grid.innerHTML = `<div class="card" style="grid-column:span 12"><div class="empty">${msg}</div></div>`;
    }

    function wishCardTpl(w) {
      const pills = `
        <span class="pill">${w.visibility}</span>
        <span class="pill">${w.status}</span>
        ${typeof w.goal_amount === "number" ? `<span class="pill">Meta: ${w.goal_amount}</span>` : ""}
      `;
      return `
      <div class="card" data-id="${w.id}">
        <div class="row">
          <div>
            <div class="title">${escapeHTML(w.title || "Sin título")}</div>
            <div class="meta">${pills}</div>
            ${w.description ? `<div class="desc">${escapeHTML(w.description)}</div>` : ""}
          </div>
          <div class="actions">
            <a class="Link" href="javascript:void(0)" data-action="toggle" aria-label="ver detalles">Ver detalles</a>
          </div>
        </div>

        <details>
          <summary>Detalles</summary>
          <div class="panel">
            <div class="muted" style="margin-bottom:8px">Eventos</div>
            <div class="list" data-slot="events"><div class="muted">Cargando…</div></div>
            <div style="height:14px"></div>
            <div class="muted" style="margin-bottom:8px">Regalos (gifts)</div>
            <div class="list" data-slot="gifts"><div class="muted">Cargando…</div></div>
          </div>
        </details>
      </div>`;
    }

    function giftItemTpl(g) {
      return `
      <div class="item">
        <div>
          <div><strong>${escapeHTML(g.title)}</strong></div>
          ${g.description ? `<div class="muted">${escapeHTML(g.description)}</div>` : ""}
        </div>
        <div class="muted">${g.price!=null? fmt.format(g.price):""} &nbsp; <span class="pill">${g.status}</span></div>
      </div>`;
    }

    function eventItemTpl(e) {
      const when = e.date ? new Date(e.date).toLocaleString() : "Sin fecha";
      return `
      <div class="item">
        <div>
          <div><strong>${escapeHTML(e.title)}</strong></div>
          <div class="muted">${when}${e.location?` • ${escapeHTML(e.location)}`:""}</div>
        </div>
      </div>`;
    }

    function escapeHTML(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    /***********************
     * LOADERS
     ***********************/
    async function loadWishes() {
      grid.innerHTML = cardSkeleton() + cardSkeleton() + cardSkeleton();

      // Base fields; si usas rol Public, el backend debe permitir leer estos campos
      const fields = [
        "id","title","description","status","visibility",
        "goal_amount","collected_amount"
      ].join(",");

      // Filtros
      const params = {
        fields,
        sort: "-id",
        limit: "30",
        "filter[visibility][_eq]": "public"
      };

      // Búsqueda en título/description
      const q = $q.value.trim();
      lastQuery = q;
      if (q) {
        // Directus filter OR: _or[][title][_contains]=q
        params["_or[0][title][_icontains]"] = q;
        params["_or[1][description][_icontains]"] = q;
      }

      // Filtro status
      const st = $status.value;
      if (st) params["filter[status][_eq]"] = st;

      try{
        const data = await api("/items/wishes", params);
        if (!data?.data?.length) return renderEmpty("No hay wishes que coincidan con tu búsqueda.");
        grid.innerHTML = data.data.map(wishCardTpl).join("");

        // Wire detalles
        for (const card of grid.querySelectorAll(".card")) {
          const id = card.getAttribute("data-id");
          const btn = card.querySelector('[data-action="toggle"]');
          const det = card.querySelector("details");
          btn?.addEventListener("click", () => det.toggleAttribute("open"));
          det?.addEventListener("toggle", async () => {
            if (det.open && !card.dataset.loaded) {
              await loadEvents(id, card.querySelector('[data-slot="events"]'));
              await loadGifts(id, card.querySelector('[data-slot="gifts"]'));
              card.dataset.loaded = "1";
            }
          });
        }
      }catch(err){
        console.error(err);
        renderEmpty("No se pudo cargar. Reintenta más tarde.");
      }
    }

    async function loadEvents(wishId, slot){
      try{
        const data = await api("/items/events", {
          "fields": "id,title,date,location",
          "filter[wish][_eq]": wishId,
          "sort": "-date",
          "limit": "20"
        });
        const items = data?.data || [];
        slot.innerHTML = items.length
          ? items.map(eventItemTpl).join("")
          : '<div class="muted">Sin eventos</div>';
      }catch(e){
        slot.innerHTML = '<div class="muted">Error cargando eventos</div>';
      }
    }

    async function loadGifts(wishId, slot){
      try{
        const data = await api("/items/gifts", {
          "fields": "id,title,description,price,status",
          "filter[wish][_eq]": wishId,
          "sort": "-id",
          "limit": "20"
        });
        const items = data?.data || [];
        slot.innerHTML = items.length
          ? items.map(giftItemTpl).join("")
          : '<div class="muted">Sin regalos</div>';
      }catch(e){
        slot.innerHTML = '<div class="muted">Error cargando regalos</div>';
      }
    }

    /***********************
     * EVENTS UI
     ***********************/
    function debounce(fn, ms=350){
      let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); };
    }
    $q.addEventListener("input", debounce(() => {
      loadWishes();
    }, 350));
    $status.addEventListener("change", loadWishes);
    $refresh.addEventListener("click", loadWishes);

    // Init
    loadWishes();
  </script>
</body>
</html>
