<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deseando — Wishes</title>
  <style>
    :root{
      --bg:#fff; --fg:#0f172a; --muted:#64748b; --card:#f8fafc; --border:#e2e8f0;
      --radius:18px;
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    header{position:sticky;top:0;background:rgba(255,255,255,.8);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
    .container{max-width:1100px;margin:0 auto;padding:20px}
    .title{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
    .sub{color:var(--muted);font-weight:600}
    .toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-top:14px}
    .input,.select{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff;outline:0}
    .input:focus,.select:focus{box-shadow:0 0 0 4px rgba(59,130,246,.08);border-color:#cbd5e1}
    main .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:160px;display:flex;flex-direction:column;gap:8px;transition:.15s ease transform,.15s ease box-shadow}
    .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(2,6,23,.06)}
    .card h3{margin:0;font-size:18px}
    .badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
    .dot{width:8px;height:8px;border-radius:999px;background:#94a3b8}
    .dot.active{background:#16a34a}.dot.completed{background:#0ea5e9}.dot.archived{background:#64748b}
    .center{margin:40px auto;text-align:center;color:var(--muted)}
    footer{border-top:1px solid var(--border);padding:24px;color:var(--muted);text-align:center;margin-top:24px}
    .hidden{display:none}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="title">Deseando <span class="sub">• Wishes públicos</span></div>
      <div class="toolbar">
        <input id="q" class="input" type="search" placeholder="Buscar por título o descripción…" />
        <select id="status" class="select" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option value="active">Activos</option>
          <option value="completed">Completados</option>
          <option value="archived">Archivados</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="center">Cargando…</div>
    <div id="error" class="center hidden">No se pudo cargar. Reintenta más tarde.</div>
    <div id="empty" class="center hidden">No hay resultados.</div>
    <div id="list" class="grid hidden" aria-live="polite"></div>
  </main>

  <footer><small>Directus → Front demo — despliegue via EasyPanel</small></footer>

  <script>
    // ====== CONFIG ======
    const DIRECTUS_URL = "https://hoztlat-regalos.6vlrrp.easypanel.host";
    // ⚠️ Solo para prueba. Cambia por token de rol FRONTEND (solo lectura) después.
    const FRONT_TOKEN  = "Wgzv1jeqXBKlqw5CtRPdr0ju7izPiA7g";

    // ====== UI refs ======
    const $ = (id) => document.getElementById(id);
    const elList   = $("list");
    const elLoad   = $("loading");
    const elErr    = $("error");
    const elEmpty  = $("empty");
    const elQ      = $("q");
    const elStatus = $("status");

    // ====== Fetch ======
    async function fetchWishes({ q="", status="" } = {}) {
      const params = new URLSearchParams();
      params.set("fields", "title,description,status");
      params.set("filter[visibility][_eq]", "public");
      if (status) params.set("filter[status][_eq]", status);
      if (q) params.set("search", q);
      params.set("limit", "100");

      const res = await fetch(`${DIRECTUS_URL}/items/wishes?${params.toString()}`, {
        method: "GET",
        headers: {
          Authorization: `Bearer ${FRONT_TOKEN}`,
          "Content-Type": "application/json"
        }
      });

      if (!res.ok) {
        const txt = await res.text().catch(()=> "");
        throw new Error(`HTTP ${res.status} ${txt}`);
      }
      const json = await res.json();
      return Array.isArray(json.data) ? json.data : [];
    }

    // ====== Render ======
    function escapeHtml(str){return (str||"").replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]))}
    function card(w){
      const s = (w.status||"active").toLowerCase();
      const d = (w.description||"").trim();
      return `
        <article class="card">
          <h3>${escapeHtml(w.title||"Sin título")}</h3>
          <div class="badge"><span class="dot ${s}"></span><span>${s}</span></div>
          ${d ? `<p>${escapeHtml(d)}</p>` : `<p class="muted">Sin descripción</p>`}
        </article>
      `;
    }

    async function load(){
      try{
        elErr.classList.add("hidden"); elEmpty.classList.add("hidden");
        elList.classList.add("hidden"); elLoad.classList.remove("hidden");

        const data = await fetchWishes({ q: elQ.value.trim(), status: elStatus.value });

        elLoad.classList.add("hidden");
        if (!data.length){ elEmpty.classList.remove("hidden"); elList.innerHTML=""; return; }

        elList.innerHTML = data.map(card).join("");
        elList.classList.remove("hidden");
      }catch(e){
        console.error(e);
        elLoad.classList.add("hidden");
        elErr.classList.remove("hidden");
      }
    }

    // ====== Events ======
    elQ.addEventListener("input", debounce(load, 250));
    elStatus.addEventListener("change", load);
    function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

    // Init
    load();
  </script>
</body>
</html>
